<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hindi Text to Speech</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 0 auto; padding: 20px; background: #f6f6f4; color: #222; }
  h1 { font-size: 1.4rem; }
  textarea { width: 100%; height: 160px; padding: 12px; font-size: 1rem; border: 1px solid #bbb; border-radius: 8px; box-sizing: border-box; resize: vertical; }
  button { margin-top: 12px; padding: 12px 24px; font-size: 1rem; border: 0; border-radius: 8px; background: #1a73e8; color: #fff; cursor: pointer; }
  button:disabled { background: #999; }
  #status { margin-top: 12px; color: #555; }
  audio { width: 100%; margin-top: 16px; }
  a { display: inline-block; margin-top: 8px; }
</style>
</head>
<body>
  <h1>Hindi Text to Speech</h1>
  <textarea id="text" placeholder="यहाँ अपना स्क्रिप्ट लिखो..."></textarea>
  <button id="btn">आवाज़ बनाओ</button>
  <div id="status"></div>
  <audio id="player" controls hidden></audio>
  <a id="download" download="voice.wav" hidden>Download WAV</a>

<script>
const btn = document.getElementById("btn");
const statusEl = document.getElementById("status");
const player = document.getElementById("player");
const dl = document.getElementById("download");

btn.addEventListener("click", async () => {
  const text = document.getElementById("text").value.trim();
  if (!text) { statusEl.textContent = "पहले कुछ लिखो।"; return; }
  btn.disabled = true;
  statusEl.textContent = "बन रहा है... (पहली बार थोड़ा टाइम लग सकता है)";
  try {
    const res = await fetch("/speak", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text })
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error || "Error aaya");
    }
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    player.src = url; player.hidden = false; player.play();
    dl.href = url; dl.hidden = false;
    statusEl.textContent = "हो गया ✅";
  } catch (e) {
    statusEl.textContent = "Error: " + e.message;
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
